# Stellt die Supabase Edge Function „ki“ bereit, sobald sich ihr Code auf main ändert (oder per Hand).
# Braucht das GitHub-Secret SUPABASE_ACCESS_TOKEN (persönlicher Zugangsschlüssel von supabase.com).
# Die Projekt-Kennung kommt aus dem vorhandenen Secret VITE_SUPABASE_URL.
# Der Claude-API-Schlüssel steht NICHT hier, sondern nur als Secret in Supabase (siehe docs/KI-EINRICHTUNG.md).
name: KI-Funktion bereitstellen

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-ki.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
    steps:
      - name: Zugang vorhanden?
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN oder VITE_SUPABASE_URL fehlt – KI-Funktion wird nicht bereitgestellt (siehe docs/KI-EINRICHTUNG.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != 'true'
        with:
          version: latest
      - name: Funktion „ki“ bereitstellen
        if: steps.check.outputs.skip != 'true'
        run: |
          REF=$(echo "$SUPABASE_URL" | sed -E 's#^https://([^.]+)\..*#\1#')
          supabase functions deploy ki --project-ref "$REF" --no-verify-jwt
