# Kostenlose Supabase-Projekte schlafen nach einer Woche ohne Nutzung ein.
# Dieser Workflow fragt die Datenbank alle 3 Tage kurz an, damit das nicht passiert.
# Nutzt dieselben Secrets wie "Veröffentlichen": VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY.
name: Supabase wach halten

on:
  schedule:
    - cron: '17 5 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank anpingen
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Supabase-Secrets fehlen – nichts zu tun."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
